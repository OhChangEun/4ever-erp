name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PR 에 번들과 Lighthouse 표를 코멘트로 단다(CI 고도화 2). 그 외에는 읽기만
permissions:
  contents: read
  pull-requests: write

env:
  NEXT_TELEMETRY_DISABLED: 1
  # 빌드 때 src/lib/auth/session.ts 가 SESSION_SECRET 없으면 throw 한다. CI 전용 값이고 배포에는 쓰지 않는다.
  SESSION_SECRET: ci-only-secret-do-not-use-in-production

jobs:
  verify:
    name: lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json 의 packageManager 를 따른다(모노레포 1 카드)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (lockfile 그대로)
        run: pnpm install --frozen-lockfile

      # Turborepo 캐시. 입력이 같은 작업(lint, 타입 검사, 단위 테스트, 패키지 테스트)은 다시 돌리지 않는다
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint, type check, unit tests (turbo)
        run: pnpm verify

      - name: Build
        run: pnpm build

      # SSO 포털(apps/portal, 로컬 전용이라 배포는 안 한다). 빌드가 깨지지 않는지만 본다
      - name: Build portal
        run: pnpm --filter @everp/portal build

      # 라우트별 첫 로드 JS 를 기준선(perf/bundle-baseline.json)과 비교한다. 표는 job summary 에.
      # 한 라우트라도 +5KB(gzip) 넘게 늘면 실패. 의도한 증가면 같은 PR 에서 pnpm bundle:baseline
      # shell: bash 를 적어야 pipefail 이 켜진다. 없으면 bash -e 로 돌아 tee 의 종료 코드 0 이 실패를 가린다(리뷰 P1)
      - name: Bundle size
        shell: bash
        run: |
          set +e
          pnpm --silent bundle:check > ci-report.md
          status=$?
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # 방금 만든 빌드를 next start 로 띄워 화면을 시험한다. 브라우저는 러너에 설치된 Chrome(channel: 'chrome')
      - name: E2E (Playwright)
        run: pnpm e2e

      # 로그인 화면과 로그인 뒤 화면 3개(대시보드, 재고, 재무). 접근성 0.9 아래면 실패, 성능은 경고만
      # 보고서는 밖으로 올리지 않고 artifact 로만 남긴다(perf/lighthouserc.cjs)
      - name: Lighthouse
        shell: bash
        # 측정이나 검사가 실패해도 표는 남긴다. 회귀를 볼 때가 표가 가장 필요할 때다(리뷰 P2)
        run: |
          set +e
          bash perf/lighthouse.sh
          measured=$?
          node perf/lighthouse-summary.mjs > lighthouse.md
          summarized=$?
          cat lighthouse.md >> "$GITHUB_STEP_SUMMARY"
          { echo; cat lighthouse.md; } >> ci-report.md
          [ "$measured" -eq 0 ] && [ "$summarized" -eq 0 ]

      - name: Lighthouse 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          # .lighthouseci 는 숨김 폴더라 기본값이면 빠진다(리뷰 P2)
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      # 번들 표와 Lighthouse 표를 PR 코멘트 하나로. 다음 실행은 같은 코멘트를 고친다.
      # Dependabot PR 의 토큰은 쓰기 권한이 없어 건너뛴다
      - name: PR 코멘트
        if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && hashFiles('ci-report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file ci-report.md --edit-last || gh pr comment "$PR" --body-file ci-report.md

      - name: E2E 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
