name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # 빌드 때 src/lib/auth/session.ts 가 SESSION_SECRET 없으면 throw 한다. CI 전용 값이고 배포에는 쓰지 않는다.
  SESSION_SECRET: ci-only-secret-do-not-use-in-production

jobs:
  verify:
    name: lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile 그대로)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # 라우트별 첫 로드 JS 를 기준선(perf/bundle-baseline.json)과 비교한다. 표는 job summary 에.
      # 한 라우트라도 +5KB(gzip) 넘게 늘면 실패. 의도한 증가면 같은 PR 에서 npm run bundle:baseline
      # shell: bash 를 적어야 pipefail 이 켜진다. 없으면 bash -e 로 돌아 tee 의 종료 코드 0 이 실패를 가린다(리뷰 P1)
      - name: Bundle size
        shell: bash
        run: npm run --silent bundle:check | tee -a "$GITHUB_STEP_SUMMARY"

      # 방금 만든 빌드를 next start 로 띄워 화면을 시험한다. 브라우저는 러너에 설치된 Chrome(channel: 'chrome')
      - name: E2E (Playwright)
        run: npm run e2e

      - name: E2E 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
