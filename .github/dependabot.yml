# 의존성 갱신 PR(계획 16-1 "CI 고도화: Dependabot 월 1회 그룹").
# 월 1회. minor 와 patch 는 운영, 개발 의존성 별로 한 PR 에 묶는다. major 는 하나씩 따로 온다.
# cooldown: 나온 지 14일 지난 버전만 올린다. 막 나온 버전의 공급망 사고를 피한다.
# 올라온 PR 도 같은 CI(lint, 타입, 단위, 빌드, 번들 예산, e2e)를 통과해야 머지된다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ['*']
