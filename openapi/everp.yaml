      properties:
        year:
          type: number
        month:
          type: number
        week:
          type: number
        sale:
          type: number
        orderCount:
          type: number
      required:
        - year
        - month
        - week
        - sale
        - orderCount
    TrendScale:
      type: object
      properties:
        sale:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
          required:
            - min
            - max
        orderCount:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
          required:
            - min
            - max
      required:
        - sale
        - orderCount
    ProductShare:
      type: object
      properties:
        productCode:
          type: string
        productName:
          type: string
        sale:
          type: number
        saleShare:
          type: number
      required:
        - productCode
        - productName
        - sale
        - saleShare
    TopCustomer:
      type: object
      properties:
        customerCode:
          type: string
        customerName:
          type: string
        orderCount:
          type: number
        sale:
          type: number
        active:
          type: boolean
      required:
        - customerCode
        - customerName
        - orderCount
        - sale
        - active
    SalesItemResponse:
      type: object
      properties:
        itemId:
          type: string
        itemNumber:
          type: string
        itemName:
          type: string
        uomName:
          type: string
        unitPrice:
          type: number
      required:
        - itemId
        - itemNumber
        - itemName
        - uomName
        - unitPrice
    NotificationListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NotificationData'
        page:
          $ref: '#/components/schemas/Page'
      required:
        - content
        - page
    NotificationData:
      type: object
      properties:
        notificationId:
          type: string
        notificationTitle:
          type: string
        notificationMessage:
          type: string
        linkType:
          type: string
        linkId:
          type: string
        source:
          type: string
          enum:
            - PR
            - SD
            - IM
            - FCM
            - HRM
            - PP
            - CUS
            - SUP
        createdAt:
          type: string
        isRead:
          type: boolean
      required:
        - notificationId
        - notificationTitle
        - notificationMessage
        - linkType
        - linkId
        - source
        - createdAt
        - isRead
    NotificationCountResponse:
      type: object
      properties:
        count:
          type: number
      required:
        - count
