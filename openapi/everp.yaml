          type: boolean
    Stat:
      type: object
      description: 지표 하나. delta_rate 는 직전 기간 대비 변화율(0.12 = 12%)
      required:
        - value
        - delta_rate
      properties:
        value:
          type: number
        delta_rate:
          type: number
        trend:
          type: array
          description: >-
            기간 안의 추이(시각화 1). 주는 일 7개, 월은 주 5개, 분기는 주 13개, 연은 월 12개.
