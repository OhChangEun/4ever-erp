openapi: 3.1.0
info:
  title: EverP API
  version: 0.1.0
  description: |
    EverP 프론트엔드가 부르는 API 계약. 백엔드가 없어 프론트엔드가 쓴다(OpenAPI 계약 1 카드).
    원본은 이 파일이다. 타입(src/lib/api/openapi.gen.ts)은 `npm run openapi` 로 만들고,
    목(src/mocks/handlers)은 openapi-msw 로 이 계약에 묶인다. 도메인은 창고부터 하나씩 옮긴다.
    모든 성공 응답은 `ApiEnvelope` 에 `data` 를 더한 모양이다. 실패는 `ApiError`.
servers:
  - url: /api/proxy
    description: 브라우저가 부르는 BFF 프록시. 서버는 세션을 Bearer 로 바꿔 업스트림에 넘긴다
paths:
  /scm-pp/iv/warehouses/statistic:
    get:
      operationId: getWarehouseStats
      tags:
        - warehouse
      summary: 창고 통계(주, 월, 분기, 연)
      responses:
        '200':
          description: 기간별 창고 수와 운영 중 창고 수
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/WarehouseStats'
        default:
          $ref: '#/components/responses/Error'
  /scm-pp/iv/warehouses:
    get:
      operationId: getWarehouseList
      tags:
        - warehouse
      summary: 창고 목록(페이지)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 창고 목록 한 페이지
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/WarehouseListPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addWarehouse
      tags:
        - warehouse
      summary: 창고 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWarehouseRequest'
      responses:
        '200':
          $ref: '#/components/responses/NoData'
        default:
          $ref: '#/components/responses/Error'
  /scm-pp/iv/warehouses/{warehouseId}:
    parameters:
      - name: warehouseId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWarehouseDetail
      tags:
        - warehouse
      summary: 창고 상세
      responses:
        '200':
          description: 창고 정보와 담당자
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/WarehouseDetail'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: editWarehouse
      tags:
        - warehouse
      summary: 창고 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditWarehouseRequest'
      responses:
        '200':
          $ref: '#/components/responses/NoData'
        default:
          $ref: '#/components/responses/Error'
